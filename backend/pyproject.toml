[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "health-plan-optimizer"
version = "0.1.0"
description = "Multi-Agent Decision Intelligence System — Health Plan Optimizer (Argusoft Hackathon Two)"
requires-python = ">=3.11"
dependencies = [
    # Orchestration
    "langgraph>=0.2",
    "langchain-core>=0.3",
    # LLM providers (default: anthropic; openai optional)
    "anthropic>=0.39",
    # "openai>=1.40",            # uncomment if using the OpenAI provider
    # API + realtime
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",
    # Schemas + config
    "pydantic>=2.5",
    "pydantic-settings>=2.0",
    # Tools / HTTP
    "httpx>=0.27",
    # "tavily-python>=0.3",      # web search (or call the API directly via httpx)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# NOTE: This is a reference manifest for the build. Pin exact versions when implementing.
# Build order is defined in ../docs/build-plan.md.
